# 订阅服务数据目录；inputs 子目录会存放导入的订阅发布包内容。
data_dir: /opt/proxystack/sub
# HTTP 服务监听地址，格式为 host:port。
listen: 0.0.0.0:3003
# 订阅访问控制配置；生产环境建议使用 token。
access:
  # 访问控制类型；支持 none、token。
  type: token
  # token 模式使用的访问令牌；type=token 时必须填写。
  token: change-me
# 订阅模板覆盖目录；不需要自定义模板时可保持默认。
templates_dir: /opt/proxystack/sub/templates
# inputs 目录轮询间隔，单位秒；inotify 不可用时生效。
watch_interval: 2.0
# inputs 变更防抖时间，单位秒；避免保存过程触发重复加载。
watch_debounce: 0.3
# Surge 托管配置头参数；用于 /surge_sub/:user 输出 #!MANAGED-CONFIG。
managed_config:
  # 是否输出 Surge 托管配置头。
  enabled: true
  # 公网访问前缀；反代部署时填写，例如 https://example.com/api/sub；留空时使用请求 URL。
  public_base_url:
  # Surge 托管配置刷新间隔，单位秒。
  interval: 86400
  # 是否启用 Surge strict 模式。
  strict: true
