version: 1
# 初始全局配置模板；init 会改写 base_dir 和 external_host。
base_dir: /opt/proxystack

paths:
  bin: bin
  geo: geo
  stacks: stacks
  runtime: runtime
  generated: runtime/generated
  publish: publish
  downloads: downloads
  sub: sub

external_host: proxy.example.com

subscription:
  # 订阅输入来源；支持全集：local。
  source: local
  # 订阅节点名称策略；支持全集：preserve、prefix-source、template。
  # template 模式可配合 remark_template 自定义节点名称。
  remark_policy: prefix-source

port_ranges:
  # Only used by add/clone --allocate-ports.
  # Manually configured ports may be outside these ranges if they are valid and unique.
  xrelay_inbound: 4300-4399
  clash_socks: 7090-7999
  clash_controller: 19000-19999

defaults:
  clash:
    # 默认 Clash 运行模式；支持全集：Rule、Global、Direct。
    mode: Rule
    # 默认内置规则 profile；支持全集：default。
    rule_profile: default
  xrelay:
    loglevel: warning
    api:
      enabled: true
      tag: api
      listen: 127.0.0.1:10085
      services: [StatsService]
    stats:
      enabled: true
    policy:
      enabled: true
      levels:
        "0":
          statsUserUplink: true
          statsUserDownlink: true
      system:
        statsInboundUplink: true
        statsInboundDownlink: true
        statsOutboundUplink: true
        statsOutboundDownlink: true

security:
  require_auth_for_public_socks_http: true
  allow_noauth_public: false

install:
  mihomo:
    #version: latest
    version: 1.19.27
    source: auto
  xray:
    #version: latest
    version: 26.3.27
    source: auto
  geo:
    version: latest
    source: auto
