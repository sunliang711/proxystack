port: 7890
socks-port: 7891
redir-port: 7892
tproxy-port: 7893
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: false
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  nameserver:
    - tls://dns.rubyfish.cn:853
    - 119.29.29.29
    - 223.5.5.5
  fallback:
    - tls://1.1.1.1:853
    - tcp://1.1.1.1:53
    - tcp://208.67.222.222:443
    - tls://dns.google
    - tls://dns.rubyfish.cn:853
    - 114.114.114.114
    - 8.8.8.8
tun:
  enable: false
proxies:
  - name: Manual Relay
    type: socks5
    server: proxy.example.com
    port: 24001
    username: demo-user
    password: demo-pass
    udp: true
proxy-groups:
  - name: AllProxy
    type: select
    proxies:
      - AutoGroup
      - LoadBalance

      - "Manual Relay"

  - name: LoadBalance
    type: load-balance
    url: http://www.gstatic.com/generate_204
    interval: 300
    strategy: round-robin
    proxies:

      - "Manual Relay"

  - name: AutoGroup
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:

      - "Manual Relay"

  - name: AppleGroup
    type: select
    proxies:
      - DIRECT
      - AllProxy
      - AutoGroup

      - "Manual Relay"

