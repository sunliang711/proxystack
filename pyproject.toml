[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxystack"
version = "0.1.0"
description = "Proxy stack orchestration for Xray, mihomo, and subscription bundles."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
proxystack-agent = "proxystack.cli.agent:run"
proxystack-sub = "proxystack.cli.sub:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proxystack = ["templates/*.yaml", "templates/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
