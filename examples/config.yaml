version: 1
# Development example base dir. Production config should use /opt/proxystack.
base_dir: ./examples

paths:
  bin: bin
  geo: geo
  stacks: stacks
  runtime: runtime
  generated: runtime/generated
  publish: publish
  downloads: downloads
  sub: sub

external_host: proxy.example.com

subscription:
  source: local
  listen: 127.0.0.1:3003
  base_url: https://sub.example.com
  access:
    type: token
    token: demo-subscription-token

port_ranges:
  # Only used by add/clone --allocate-ports.
  # Manually configured ports may be outside these ranges if they are valid and unique.
  xrelay_inbound: 24000-24999
  clash_socks: 17000-17999
  clash_controller: 19000-19999

defaults:
  clash:
    mode: Rule
    rule_profile: default
  xrelay:
    loglevel: warning
    api:
      enabled: false
      tag: api
      listen: 127.0.0.1:10085
      services: [StatsService]
    stats:
      enabled: false
    policy:
      enabled: false
      levels:
        "0":
          statsUserUplink: true
          statsUserDownlink: true
      system:
        statsInboundUplink: true
        statsInboundDownlink: true
        statsOutboundUplink: true
        statsOutboundDownlink: true

security:
  require_auth_for_public_socks_http: true
  allow_noauth_public: false

install:
  mihomo:
    version: latest
    source: auto
  xray:
    version: latest
    source: auto
